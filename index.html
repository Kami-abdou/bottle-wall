<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Our building is a video game</title>
  <meta name="description" content="512 empty plastic bottles become a giant screen on our building, and the neighbourhood plays Snake on it from their phones. The full plan.">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-wall">
  <a class="skip" href="#plan-start" data-open-plan>Skip to the plan</a>

  <!-- State 1: the wall -->
  <section id="hero" class="hero" aria-labelledby="hero-title">
    <canvas id="wall-canvas" class="hero__canvas" role="img" aria-label=""></canvas>

    <header class="hero__top">
      <h1 id="hero-title" class="hero__title"></h1>
      <p class="hero__idea" id="hero-idea"></p>
    </header>

    <button type="button" id="wall-hit" class="wall-hit" aria-describedby="hero-idea">
      <span class="visually-hidden">Open the plan</span>
    </button>

    <div class="hero__bottom">
      <p class="hero__prompt" id="hero-prompt"><span class="led-dot" aria-hidden="true"></span><span id="hero-prompt-text"></span></p>
      <p class="hero__play-hint" id="play-hint" hidden></p>
      <div class="hero__actions">
        <button type="button" class="btn btn--led" id="play-btn"></button>
        <button type="button" class="btn btn--ghost" id="stop-btn" hidden>Stop playing</button>
      </div>
      <div class="dpad" id="dpad" hidden>
        <button type="button" class="dpad__btn dpad__up" data-dir="up" aria-label="Up"></button>
        <button type="button" class="dpad__btn dpad__left" data-dir="left" aria-label="Left"></button>
        <button type="button" class="dpad__btn dpad__right" data-dir="right" aria-label="Right"></button>
        <button type="button" class="dpad__btn dpad__down" data-dir="down" aria-label="Down"></button>
      </div>
    </div>
    <p class="visually-hidden" aria-live="polite" id="game-status"></p>
  </section>

  <!-- Paper that the zooming bottle turns into -->
  <div id="paper-veil" class="paper-veil" aria-hidden="true"></div>

  <!-- State 2: the plan (rendered from content.js) -->
  <div id="plan" class="plan" hidden>
    <div class="topbar">
      <button type="button" class="back-btn" id="back-btn">
        <svg class="back-btn__icon" viewBox="0 0 16 8" aria-hidden="true">
          <g fill="currentColor">
            <circle cx="2" cy="2" r="1.3"/><circle cx="6" cy="2" r="1.3" opacity=".35"/><circle cx="10" cy="2" r="1.3" opacity=".35"/><circle cx="14" cy="2" r="1.3" opacity=".35"/>
            <circle cx="2" cy="6" r="1.3"/><circle cx="6" cy="6" r="1.3"/><circle cx="10" cy="6" r="1.3"/><circle cx="14" cy="6" r="1.3" opacity=".35"/>
          </g>
        </svg>
        Back to the wall
      </button>
      <details class="toc-mobile" id="toc-mobile">
        <summary><span class="toc-mobile__label">Sections</span> <span class="toc-mobile__current" id="toc-current"></span></summary>
        <nav aria-label="Plan sections" class="toc-mobile__panel" id="toc-mobile-nav"></nav>
      </details>
    </div>

    <div class="plan__grid">
      <nav class="toc" id="toc" aria-label="Plan sections"></nav>
      <main class="doc" id="doc" tabindex="-1"></main>
    </div>
  </div>

  <script src="content.js"></script>
  <script src="js/wall.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
